name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - sizzlysam

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Test Go modules
        working-directory: backend
        run: |
          packages="$(go list ./...)"
          if [ -n "$packages" ]; then
            go test ./...
          else
            go mod verify
          fi

  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check dashboard
        run: npm run web:check
